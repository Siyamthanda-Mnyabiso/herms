
spring.jpa.hibernate.ddl-auto=update

spring.application.name=herms
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/herms_db?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/herms
server.port=8080
server.max-http-request-header-size=65536

herms.admin.email=${HERMS_ADMIN_EMAIL:}
herms.admin.password=${HERMS_ADMIN_PASSWORD:}
