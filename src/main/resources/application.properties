
spring.jpa.hibernate.ddl-auto=update

spring.application.name=herms
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/herms_db?createDatabaseIfNotExist=true

spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/herms
server.port=8080
server.max-http-request-header-size=65536

herms.admin.email=${HERMS_ADMIN_EMAIL:}
herms.admin.password=${HERMS_ADMIN_PASSWORD:}

# Password reset. Emails are sent when SPRING_MAIL_HOST is set (plus SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); otherwise the reset link is only logged.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
herms.mail.from=${MAIL_FROM:no-reply@herms.local}
herms.frontend-url=${FRONTEND_URL:http://localhost:5173}
