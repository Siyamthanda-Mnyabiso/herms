spring.jpa.hibernate.ddl-auto=create-drop

spring.application.name=herms
# Tests run against their own database. Defaults match docker-compose.yml; override with
# MYSQL_HOST / MYSQL_TEST_USER / MYSQL_TEST_PASSWORD (CI sets these).
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/herms_test_db?createDatabaseIfNotExist=true

spring.datasource.username=${MYSQL_TEST_USER:root}
spring.datasource.password=${MYSQL_TEST_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/herms
server.port=8080
